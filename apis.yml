aid: cybergrx
name: CyberGRX
description: >-
  CyberGRX is a third-party cyber risk management platform — the Global Risk
  Exchange (GRX) — that helps organizations assess, monitor, and reduce risk
  across their vendor and supplier ecosystem. It combines a shared library of
  standardized vendor risk assessments with analytics for inherent and residual
  risk, control gaps, and findings. CyberGRX was acquired by ProcessUnity in
  2023 and is now delivered as the ProcessUnity Global Risk Exchange. It exposes
  a versioned REST API (v1, bulk-v1, v2) authenticated with an account API token
  passed in the Authorization header, including a Bulk API that returns an entire
  third-party ecosystem — residual risk, control scores, and findings — in a
  single request, plus first-party Python examples and Go/Splunk connectors.
